# HTTPS / TLS profile for Dice Duel.
# Activate with: --spring.profiles.active=secure
#
# Generate the keystore referenced below before starting (see README.md):
#   keytool -genkeypair -alias diceduel -keyalg RSA -keysize 2048 \
#           -storetype PKCS12 -keystore src/main/resources/keystore.p12 \
#           -validity 365 -storepass changeit -dname "CN=localhost"

server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=diceduel

# Reject weak protocols; only TLS 1.2/1.3 are accepted.
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
