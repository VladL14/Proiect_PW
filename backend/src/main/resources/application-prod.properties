# Production profile. Activate with: --spring.profiles.active=prod
#
# Still H2, but FILE-backed instead of in-memory, so accounts, matches and
# match history survive a backend restart. Combine with the "secure" profile
# for HTTPS:  --spring.profiles.active=prod,secure
#
# CAVEAT: on free hosts with an ephemeral filesystem (e.g. Render free tier),
# the ./data folder is wiped on every redeploy unless you attach a persistent
# disk and point DATA_DIR at it.

spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/diceduel;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update

# Disable the H2 web console in production for safety.
spring.h2.console.enabled=false
