# Most free hosts (Render, Railway, Fly, ...) inject the port through $PORT.
# Locally it falls back to 3000.
server.port=${PORT:3000}
spring.application.name=dice-duel-api

# Public base URL of THIS backend, used to build absolute avatar URLs.
# In production set the env var APP_PUBLIC_BASE_URL to the deployed host,
# e.g. https://dice-duel-api.onrender.com (no trailing slash).
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:3000}

# Comma-separated list of browser origins allowed by CORS. In production set
# the env var APP_CORS_ORIGINS to the deployed frontend origin(s),
# e.g. https://dice-duel.netlify.app
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://localhost:4200,https://127.0.0.1:4200,https://diceduel-pw.netlify.app}

spring.datasource.url=jdbc:h2:mem:diceduel
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- HTTPS / TLS --------------------------------------------------------------
# By default the application serves plain HTTP on port 3000 for local
# development. To run over HTTPS (so that credentials, bearer tokens, account
# data and match history are never sent in clear text) start the application
# with the "secure" profile:
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=secure
#   java -jar dice-duel-api.jar --spring.profiles.active=secure
#
# The TLS settings live in application-secure.properties. First generate a
# development keystore (see README.md):
#
#   keytool -genkeypair -alias diceduel -keyalg RSA -keysize 2048 \
#           -storetype PKCS12 -keystore src/main/resources/keystore.p12 \
#           -validity 365 -storepass changeit -dname "CN=localhost"
